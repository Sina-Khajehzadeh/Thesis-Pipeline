name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository assets
        run: python -m unittest discover -s tests -p "test_repository_assets.py"

  pipeline-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Run V14 self-tests
        run: python V14_Thesis_Pipeline.py --self-test

      - name: Validate blood-glucose preparation and scenarios
        run: python -m unittest discover -s thesis_study_blood_glucose/tests -p "test_*.py"
